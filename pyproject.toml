[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent"
version = "0.1.0"
description = "A tool-calling agent loop built from scratch — no framework, no dependencies."
readme = "README.md"
authors = [{ name = "Luis Manuel Barrios", email = "lmb.office@gmail.com" }]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mini-agent = "mini_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade,
# B bugbear, SIM simplification, C4 comprehensions, RUF ruff-specific.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Long, descriptive test names are the point.
"tests/*" = ["E501"]

[tool.ruff.format]
docstring-code-format = true
